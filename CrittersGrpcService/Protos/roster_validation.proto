syntax = "proto3";

import "google/protobuf/wrappers.proto";

option csharp_namespace = "CrittersGrpc";
package critters;

service RosterValidation {
  rpc Validate (RosterRequest) returns (ValidationReply);
}

message RosterRequest {
  string player_id = 1;
  google.protobuf.Int32Value jersey = 2;
  string position = 3;
  string birthday = 4;
  google.protobuf.Int32Value height = 5;
  google.protobuf.Int32Value weight = 6;
  string birth_state = 7;
}

message ValidationReply {
  repeated string errors = 1;
}